# Add INSIDE safeug.online's existing SSL VirtualHost in Virtualmin.
# Keep Virtualmin's DocumentRoot, TLS certificate and log directives.
# www.safeug.online must be a ServerAlias covered by the certificate.
# Remove conflicting old proxy rules before adding these directives.
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 60

RewriteEngine On
RewriteCond %{HTTP_HOST} !^www\.safeug\.online$ [NC]
RewriteRule ^ https://www.safeug.online%{REQUEST_URI} [R=308,L,NE]

# Keep HTTP-01 certificate validation on Virtualmin's document root.
ProxyPass /.well-known/acme-challenge/ !
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
ProxyPass / http://127.0.0.1:8099/ connectiontimeout=5 timeout=60
ProxyPassReverse / http://127.0.0.1:8099/

LimitRequestBody 12582912
Header always set Strict-Transport-Security "max-age=31536000"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "geolocation=(self), camera=(self), microphone=(self)"
